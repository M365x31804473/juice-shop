name: Software composition analysis (SCA)

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read


jobs:
  Build_Publish_Stage:
    runs-on: ubuntu-latest
    name: Build, Publish, and Stage
    steps:
    - uses: actions/checkout@v2
    - name: Install CycloneDX
      run: npm install --global @cyclonedx/cyclonedx-npm     
    - name: Install dependencies
      env:
        NODE_ENV: development
        NPM_CONFIG_PRODUCTION: "false"
      run: npm install --include=dev
    
    - name: Generate SBOM
      run: cyclonedx-npm --output-file bom.json --output-format JSON
    
    - name: Build application
      run: npm run build
    
    - name: Remove development dependencies
      run: npm prune --omit=dev
    - name: Create BOM
      run: |
        npm install -g @cyclonedx/cyclonedx-npm@latest
        npm run sbom
      shell: bash
    - name: Upload BOM to Dependency-Track
      run: |
        curl -v -X "POST" "https://dependency-track-devsecops-669358591.azurewebsites.net/api/v1/bom" \
             -H 'Content-Type: multipart/form-data' \
             -H 'X-API-Key: ${{ secrets.DTRACKAPIKEY }}' \
             -F 'project=${{ secrets.DTRACKPROJID }}' \
             -F 'projectname=DevSecOps' \
             -F 'bom=@${{ github.workspace }}/bom.xml'
      continue-on-error: true

                    
